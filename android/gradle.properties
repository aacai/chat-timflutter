org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
apmsInstrumentationEnabled=false
# tencent_calls_uikit 的 android/build.gradle:54 认这个属性名，用它把默认依赖换掉：
# LiteAVSDK_Professional 的 arm64 原生库 19.25M，LiteAVSDK_TRTC 只有 10.08M，
# 少的正好是点播(thumbplayer)、短视频录制(ugc)、downloadproxy、tpcore 这些本应用没接入的能力
# ——App 里没有 live 相关依赖，assets/live 也早确认零引用。
# 换 SDK 不砍通话功能：calls 插件、io.trtc.uikit:rtc_room_engine、tuicore 引用的 SDK 类型
# 逐个比对过，全部落在 LiteAVSDK_TRTC 的类集合里（room engine 23 个全中，tuicore 一个不引）。
# 版本号保持 12.3.0.17115 不变，TRTC 同名版本就是同一次引擎发行的精简打包。
liteavSdk=com.tencent.liteav:LiteAVSDK_TRTC:12.3.0.17115
