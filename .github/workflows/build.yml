name: build

on:
  push:
    branches: ["mycustom-feature"]
    tags: ["v*"]
    # 只改文档不触发构建；三平台一轮要烧掉几十分钟 Actions 额度。
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.4"
  APP_VERSION: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/im-credentials
      - run: flutter pub get
      - uses: ./.github/actions/patch-uikit-linux
      # 存量告警较多，先只把 error 当失败，告警在日志里单独列。
      - run: dart analyze --no-fatal-warnings
      - run: flutter test

  android:
    name: android arm64-v8a
    needs: quality
    runs-on: ubuntu-latest
    # 上一次这个 job 跑了 60 分钟被判失败，而且整份 job 日志（含前 8 步的输出）都没上传，
    # 说明 runner 是被环境搞挂的，不是编译报错。超时会正常取消，日志能留下来。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/im-credentials
      - run: flutter pub get
      - uses: ./.github/actions/patch-uikit-linux
      # app/build.gradle 排掉了 ffmpeg-android-java（那 9M 的 32 位二进制），依据是
      # 语音消息从来不碰 wav→mp3 转换。这个前提一旦被 uikit 改掉，包里的二进制就没了而代码还在调它，
      # 表现是语音消息静默坏掉，所以把前提钉在构建里。
      - name: 校验 ffmpeg 依赖排掉的前提仍成立
        run: |
          hits=$(grep -rl initRecordMp3 "$HOME/.pub-cache/hosted/" --include='*.dart' \
            | grep -v flutter_plugin_record_plus || true)
          echo "== 引用 initRecordMp3 的包 =="
          [ -z "$hits" ] && echo "(none)" || echo "$hits"
          [ -z "$hits" ] || { echo "::error::有包会触发 wav->mp3 转换，ffmpeg-android-java 不能再排"; exit 1; }
      # TXIMSDK 的 AAR 很大，gradle 的 transforms 缓存会把 ubuntu runner 的盘写满。
      # 只能删确定用不上的预装内容：/opt/hostedtoolcache 里装着 Flutter 和 JDK，整目录删不得；
      # /usr/local/lib/android 是 gradle 要的 SDK，也删不得。docker 镜像这个 job 用不到。
      - name: 腾出磁盘空间
        run: |
          df -h /
          free -m
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/share/vcpkg /opt/hostedtoolcache/CodeQL /home/runner/.npm \
            /usr/local/lib/azure-powershell* /usr/local/share/powershell
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h /
          free -m
      # 每两分钟记一行磁盘/内存，构建失败时能从日志里看出是谁先耗尽的。
      - name: 资源监控
        run: |
          monitor="$RUNNER_TEMP/monitor.log"
          : > "$monitor"
          ( while sleep 120; do
              printf '%s disk_free=%s mem_avail=%sMB java_rss=%sMB\n' \
                "$(date -u +%T)" \
                "$(df -h / | awk 'NR==2{print $4}')" \
                "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                "$(ps -eo rss=,comm= | awk '$2=="java"{s+=$1} END{print int(s/1024)}')"
            done > "$monitor" ) &
          echo $! > "$RUNNER_TEMP/monitor.pid"
      # android/gradle.properties 里写的是 -Xmx8g；runner 只有 16G，还要留给 Dart AOT 和 Kotlin 编译。
      # 只改 CI 这份 checkout，本机配置不动；改完打印出来，日志里能看到生效值。
      - name: 收紧 CI 的 gradle 内存
        run: |
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          echo 'org.gradle.workers.max=2' >> android/gradle.properties
          cat android/gradle.properties
      # abiFilters 单独写没用：flutter 默认 target-platform 是 arm+arm64+x64 三个，
      # 它会把三个 ABI 的 libapp.so 和插件 so 全塞进同一个 APK（上次实测 198.6M 里 154.6M 是双份废架构）。
      # --target-platform 锁 arm64 才是真单架构。--obfuscate 混淆 Dart 符号，--split-debug-info 是它的配套。
      - run: |
          flutter build apk --release --target-platform=android-arm64 --obfuscate \
            --split-debug-info=build/symbols --dart-define=APP_VERSION="$APP_VERSION"
      - name: 校验产物只含 arm64
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          echo "== 包内原生库 Top20 =="
          unzip -l "$apk" 'lib/*' | awk '$4 ~ /^lib\// {print $1, $4}' | sort -rn | head -20
          abis=$(unzip -Z1 "$apk" 'lib/*' | awk -F/ '{print $2}' | sort -u | tr '\n' ' ')
          echo "APK 内 ABI: [$abis] 体积: $(du -h "$apk" | cut -f1)"
          [ "$abis" = "arm64-v8a " ] || { echo "::error::产物混进了其它架构: [$abis]"; exit 1; }
          # 依赖 AAR 发来的 assets 也一起盯住：AGP 的 packaging exclude 管不到它们，只能排依赖。
          left=$(unzip -Z1 "$apk" | grep -c -e '^assets/armeabi' -e 'ffmpeg$' || true)
          echo "非 arm64 的 32 位二进制残留: $left 项"
          [ "$left" = "0" ] || { echo "::error::包里还有 32 位二进制残留"; unzip -Z1 "$apk" | grep -e '^assets/armeabi' -e 'ffmpeg$'; exit 1; }
          # LiteAVSDK 换没换成功，看产物里还有没有 Professional 独有的原生库，别只信 gradle.properties。
          pro_only=$(unzip -Z1 "$apk" 'lib/*' | grep -c -e libdownloadproxy -e libtpcore-master || true)
          echo "LiteAVSDK_Professional 独有原生库: $pro_only 项"
          [ "$pro_only" = "0" ] || { echo "::error::LiteAVSDK_Professional 还在依赖图里，liteavSdk 覆盖没生效"; exit 1; }
          # resConfigs 'en','zh' 生效与否只认产物：arsc 是 stored，real=raw，无过滤时实测 1,466,444。
          # 阈值留了余地（1.2M），只要它没明显变小就是没生效，别猜。
          arsc=$(unzip -l "$apk" resources.arsc | awk '$4=="resources.arsc"{print $1}')
          fa=$(unzip -Z1 "$apk" 'assets/flutter_assets/*' | wc -l)
          echo "resources.arsc=$arsc  flutter_assets 条目=$fa"
          [ "$arsc" -lt 1200000 ] || { echo "::error::resConfigs 没生效，resources.arsc 仍是 $arsc"; exit 1; }
          # AGP 的坑：库里有 dummy_locale 资源时，resConfigs 会把整个 assets 目录删空。
          # 本包无 dummy_locale，但这条兜底要留着——上一轮 flutter_assets 是 452 项。
          [ "$fa" -ge 400 ] || { echo "::error::resConfigs 把 flutter_assets 删到只剩 $fa 项"; exit 1; }
      # 每轮都把包体构成打出来，瘦身效果靠量不靠猜。
      # 必须按压缩后体积算：so 和 png 是 stored（Flutter 的 noCompress），raw=实占；
      # 但 json/dex 是 deflate，raw 会虚高一倍（rocket.json raw 5.8M 实际只占 4.4M）。
      - name: 包体构成
        run: |
          python3 - build/app/outputs/flutter-apk/app-release.apk <<'PY'
          import sys, zipfile, collections
          z = zipfile.ZipFile(sys.argv[1])
          rows = [(i.file_size, i.compress_size, i.filename) for i in z.infolist()]
          print('APK 条目 %d，压缩后合计 %.1fM' % (len(rows), sum(r[1] for r in rows) / 1048576))
          print('== 单文件 Top15（按包内实占） ==')
          for fs, cs, n in sorted(rows, key=lambda r: -r[1])[:15]:
              print('%6.2fM raw=%6.2fM  %s' % (cs / 1048576, fs / 1048576, n))
          print('== 前缀汇总 ==')
          def bucket(n):
              p = n.split('/')
              if p[:2] == ['assets', 'flutter_assets']:
                  return 'flutter_assets/' + '/'.join(p[2:4])
              if p[0] == 'assets' and len(p) > 1:
                  return 'assets/' + p[1]
              if p[0] == 'lib':
                  return 'lib/' + p[1]
              return n if len(p) == 1 else p[0] + '/' + p[1]
          b = collections.Counter()
          for fs, cs, n in rows:
              b[bucket(n)] += cs
          for k, v in sorted(b.items(), key=lambda x: -x[1])[:18]:
              print('%7.2fM  %s' % (v / 1048576, k))
          print('== 非 flutter_assets 的 assets 根文件 ==')
          for fs, cs, n in rows:
              if n.startswith('assets/') and not n.startswith('assets/flutter_assets'):
                  print('%7.3fM  %s' % (cs / 1048576, n))
          PY
      - name: 资源占用记录
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/monitor.pid")" 2>/dev/null || true
          cat "$RUNNER_TEMP/monitor.log" 2>/dev/null || echo "没有监控记录"
      - uses: actions/upload-artifact@v4
        with:
          name: chat-timflutter-android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
          # v4 默认 if-no-files-found: warn，0 个文件也算 success；windows 就是这样空过了好几天。
          if-no-files-found: error
      # 混淆后的崩溃栈只有这两份文件能还原，必须跟版本一起留档；APK 里不能有它们。
      - name: 存档反混淆符号
        run: ls -l build/app/outputs/mapping/release/mapping.txt build/symbols/
      - uses: actions/upload-artifact@v4
        with:
          # 名字故意不带 chat-timflutter- 前缀：release job 按前缀抓附件，这份不能被发出去
          name: symbols-android-arm64
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/symbols/
          if-no-files-found: error

  windows:
    name: windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/im-credentials
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_VERSION="$APP_VERSION"
        shell: bash
      - name: 装 Inno Setup
        shell: pwsh
        run: |
          # ErrorActionPreference 必须是 Stop：choco 失败属于非终止错误，
          # 默认会把这一步判成 success，后面拿 ISCC.exe 时才知道没装（上次 zip 就是这么空过的）。
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe：$iscc" }
      - name: 打安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) { throw "找不到 Release 产物目录：$release" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $iss = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\setup.iss'
          # 路径全靠 .iss 里的相对默认值（相对 .iss 所在目录解析），不从命令行传——
          # /D 传裸反斜杠路径在 ISPP 里要不要加引号我拿不准，不拿 20 分钟构建去赌它。
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'chat-timflutter-windows-x64-setup.exe'
          if (-not (Test-Path $exe)) { throw "安装包没生成：$exe" }
          $item = Get-Item $exe
          "windows 安装包：$($item.FullName) $([math]::Round($item.Length/1MB,1))MB"
      - name: 静默安装自检
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 步骤之间不共享变量，安装包和临时目录的路径重新算一遍。
          $exe = Join-Path $env:GITHUB_WORKSPACE 'chat-timflutter-windows-x64-setup.exe'
          if (-not (Test-Path $exe)) { throw "安装包不存在：$exe" }
          $log = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          $dir = Join-Path ${env:ProgramFiles} 'KeDa'
          $main = Join-Path $dir 'im_flutter_uikit_full_platform.exe'
          $unins = Join-Path $dir 'unins000.exe'
          # 只证明「ISCC 绿了」不算交付，这个包真在机器上落地过才算。
          $p = Start-Process -FilePath $exe `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装退出码 $($p.ExitCode)" }
          if (-not (Test-Path $main)) { throw "安装后主程序不存在：$main" }
          "装好：$main"
          # 中文显示名的编码是静默失效的：.iss 少了 BOM 就按 ANSI 读，装完变乱码。
          # 所以装完直接从卸载表里比对，不对就把这一步判失败。
          # 只能比前缀：Inno 会把 AppVersion 拼成「$(AppName) version $(AppVersion)」，
          # 分支构建时那就是「可达 version mycustom-feature」。
          $uninsKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{8F4B2A6D-9C1E-4B7A-8E5F-3D0A7C6B1942}_is1'
          $dn = (Get-ItemProperty $uninsKey).DisplayName
          if ($dn -notlike '可达*') { throw "卸载表里的 DisplayName 不是「可达」开头：[$dn]" }
          "卸载表 DisplayName：$dn"
          if (Test-Path $unins) {
            $u = Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            "卸载退出码 $($u.ExitCode)"
          }
          # MSI 装在同一个目录，这里必须回到干净状态；卸不干净就直接删，别让下一步吃 1603。
          if (Test-Path $dir) {
            Write-Output "::warning::Inno 卸载后目录仍在，手动清掉：$dir"
            Remove-Item -Recurse -Force $dir
          }
      - name: 装 WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 不走 choco：官方 binaries.zip 直链 + 版本写死，缺文件当场炸，比包源漂移可控。
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          Invoke-WebRequest `
            -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' `
            -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $wix -Force
          foreach ($tool in 'heat.exe','candle.exe','light.exe') {
            if (-not (Test-Path (Join-Path $wix $tool))) { throw "解压后缺 $tool" }
          }
      - name: 打 msi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) { throw "找不到 Release 产物目录：$release" }
          # Windows Installer 的 ProductVersion 只收「主.次.构建」且每段 <=65535；
          # 分支跑时 APP_VERSION 是分支名，直接塞进去 light 会报错，退成 0.0.0。
          if ($env:APP_VERSION -match '^v?(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
          } else {
            $ver = '0.0.0'
          }
          "msi ProductVersion=$ver (APP_VERSION=$env:APP_VERSION)"
          $wxs = Join-Path $env:RUNNER_TEMP 'components.wxs'
          $out = Join-Path $env:RUNNER_TEMP 'wixobj\'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # -g 给 -gg 播种，组件 GUID 每次构建都一样，不然升级时旧组件清不掉。
          & (Join-Path $wix 'heat.exe') dir $release -dr APPLICATIONFOLDER -cg AppFiles `
            -gg -g '{530149F9-0D77-4DE5-B8FB-C63D3DD369CB}' -srd -var 'var.SourceDir' -out $wxs
          if ($LASTEXITCODE -ne 0) { throw "heat 失败，退出码 $LASTEXITCODE" }
          & (Join-Path $wix 'candle.exe') -arch x64 -out $out `
            "-dSourceDir=$release" "-dProductVersion=$ver" `
            (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\msi\product.wxs') $wxs
          if ($LASTEXITCODE -ne 0) { throw "candle 失败，退出码 $LASTEXITCODE" }
          $msi = Join-Path $env:GITHUB_WORKSPACE 'chat-timflutter-windows-x64.msi'
          & (Join-Path $wix 'light.exe') -out $msi `
            (Join-Path $out 'product.wixobj') (Join-Path $out 'components.wixobj')
          if ($LASTEXITCODE -ne 0) { throw "light 失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path $msi)) { throw "msi 没生成：$msi" }
          $item = Get-Item $msi
          "msi：$($item.FullName) $([math]::Round($item.Length/1MB,1))MB"
      - name: msi 静默安装自检
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:GITHUB_WORKSPACE 'chat-timflutter-windows-x64.msi'
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $dir = Join-Path ${env:ProgramFiles} 'KeDa'
          $main = Join-Path $dir 'im_flutter_uikit_full_platform.exe'
          $p = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/l*v', $log -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "msiexec 安装退出码 $($p.ExitCode)"
          }
          if (-not (Test-Path $main)) { throw "msi 装完主程序不存在：$main" }
          "msi 装好：$main"
          # 代码页配错时 light 不报错，只把汉字换成问号，所以把产品名读出来核。
          # 不查注册表：windows-latest 预装了上百个 MSI 产品，枚举 Uninstall 表捞不到自己那条（实测两次白打）。
          # 也不看 OLE 摘要：`file x.msi` 的 Subject 在 1252 代码页下会把中文丢掉，显示成空白，跟装完的名字无关。
          $pn = $null
          try {
            $wi = New-Object -ComObject WindowsInstaller.Installer
            $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi, 0))
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @(
              "SELECT Value FROM Property WHERE Property='ProductName'"))
            $null = $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            $pn = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
          } catch { Write-Output "::warning::读 msi 的 Property 表失败，产品名没人把关：$_" }
          if ($pn) {
            "msi ProductName=[$pn]"
            if ($pn -ne '可达') { throw "msi 里的 ProductName 不是「可达」：[$pn]" }
          }
          $u = Start-Process msiexec.exe -ArgumentList '/x', $msi, '/qn' -Wait -PassThru
          "msi 卸载退出码 $($u.ExitCode)"
      - uses: actions/upload-artifact@v4
        with:
          name: chat-timflutter-windows-x64
          path: |
            chat-timflutter-windows-x64-setup.exe
            chat-timflutter-windows-x64.msi
          if-no-files-found: error

  macos:
    name: macos arm64
    needs: quality
    # macos-14 今天连续三次在排队 1-2 秒后被取消（0 步骤、没分到 runner），
    # 同 run 的 linux/windows 正常，也不是额度（本仓今日合计 372 billed 分钟 / 2000）。
    # 先换 macos-latest 试是不是 macos-14 资源池的问题。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/im-credentials
      - run: flutter pub get
      # macos-14 是 arm64 runner，不交叉编译 x86_64，产物单架构
      - run: flutter build macos --release --dart-define=APP_VERSION="$APP_VERSION"
      - name: 打安装包
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          name=$(basename "$app")
          dmg=chat-timflutter-macos-arm64.dmg
          # 拖拽式安装：窗口里一份 .app + 一个 /Applications 软链，用户拖一下就装完。
          stage=$(mktemp -d)
          ditto "$app" "$stage/$name"
          ln -s /Applications "$stage/Applications"
          # hdiutil create 在 macos runner 上会偶发「Resource busy」——同一份代码上一轮还是绿的，
          # 挂着的残留卷也能导致它，所以先把检查用的挂载点强卸，再给它三次机会。
          hdiutil detach /Volumes/ctc-check -force >/dev/null 2>&1 || true
          for i in 1 2 3; do
            if hdiutil create -volname "${name%.app}" -srcfolder "$stage" -ov -format UDZO "$dmg"; then
              break
            fi
            if [ "$i" = 3 ]; then exit 1; fi
            echo "hdiutil create 失败，重试 $i/3"
            sleep 20
          done
          # 挂载回来验交付：包在不在、快捷方式在不在、ad-hoc 签名有没有被 hdiutil 破坏。
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/ctc-check "$dmg" >/dev/null
          test -d "/Volumes/ctc-check/$name/Contents/MacOS"
          test -L /Volumes/ctc-check/Applications
          codesign --verify --verbose=2 "/Volumes/ctc-check/$name"
          hdiutil detach /Volumes/ctc-check >/dev/null
          ls -lh "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: chat-timflutter-macos-arm64
          path: chat-timflutter-macos-arm64.dmg
          if-no-files-found: error

  release:
    name: 发 Release
    needs: [android, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 只抓包体：反混淆符号（mapping.txt、.symbols）一旦挂到公开 Release，混淆就白做了。
      - uses: actions/download-artifact@v4
        with:
          name: chat-timflutter-android-arm64-v8a
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: chat-timflutter-windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: chat-timflutter-macos-arm64
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
